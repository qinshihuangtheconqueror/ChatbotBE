name: Push main

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.HUSTVA_DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.HUSTVA_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.run_id }}
        run: |
          docker build -t $ECR_REGISTRY/chatbot-hust:backend-live-chat-v2.$IMAGE_TAG .
          docker push $ECR_REGISTRY/chatbot-hust:backend-live-chat-v2.$IMAGE_TAG